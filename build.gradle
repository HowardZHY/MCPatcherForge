plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.3.15'
    id 'com.github.johnrengelman.shadow' version "8.1.1"
}

group 'com.example'
version '1.6.4'

base {
    archivesName = 'CITForge'
}

// this is just here so we can test the outputs easier and clean between tests
unimined.useGlobalCache = false

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

unimined.minecraft {
    version "1.6.4"

    minecraftForge {
        loader "9.11.1.1345"
        accessTransformer file("src/main/resources/cit_at.cfg")
        mixinConfig("mixins.cit.client.json")
    }

    minecraftRemapper.config {
        ignoreConflicts(true)
    }

    //defaultRemapJar = false
    remap(tasks.shadowJar) {
        prodNamespace("searge")
        mixinRemap {}
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.cleanroommc.com"
    }
    maven {
        url 'https://repo.spongepowered.org/maven'
    }
}

configurations {
    shade
    compile.extendsFrom shade
}

private static boolean mixinLess() {
    return false
}

dependencies {
    compileOnly('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        // Mixin includes a lot of dependencies that are too up-to-date
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
    }
    compileOnly('org.apache.logging.log4j:log4j-core:2.3.2')
    compileOnly('org.apache.logging.log4j:log4j-api:2.3.2')
    if (mixinLess()) {
        return
    }
    shade('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        // Mixin includes a lot of dependencies that are too up-to-date
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
    }
    shade('org.apache.logging.log4j:log4j-core:2.3.2')
    shade('org.apache.logging.log4j:log4j-api:2.3.2')
    shade('org.ow2.asm:asm-all:5.2')
}

processResources {
    inputs.property "version", project.version

    filesMatching("mcmod.info") {
        expand "version": project.version
    }
}

jar {
    manifest {
        attributes([
                "FMLAT": "cit_at.cfg",
                "FMLCorePlugin": getCorePlugin(),
                "FMLCorePluginContainsFMLMod": "true",
                "ForceLoadAsMod": "true",
                "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
                "TweakOrder": "-1000",
                "MixinConfigs": "mixins.cit.client.json",
                "Manifest-Version": 1.0
        ])
    }
}

private static String getCorePlugin() {
    if (mixinLess()) {
        return "mist475.mcpatcherforge.core.CITForgeCoreLess"
    }
    return "mist475.mcpatcherforge.core.CITForgeCore"
}

shadowJar {
    dependencies {}
    configurations = [project.configurations.shade]
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
}

tasks.jar {
    //enabled = false
}

tasks.shadowJar {
    //relocate("org.objectweb.asm", "org.spongepowered.asm.lib")
}

tasks.build {
    dependsOn(tasks.remapShadowJar)
}
